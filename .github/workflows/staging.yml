name: Staging (geminup-staging)

# Builds the staging database from the files in supabase/migrations and runs the tests.
# Run it by hand: Actions > Staging > Run workflow. It never touches production.
on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: "Apply pending migrations before the tests"
        type: boolean
        default: true
      deploy_functions:
        description: "Deploy the Edge Functions (supabase/functions) to staging"
        type: boolean
        default: false
      apply_auth_config:
        description: "Apply the Auth settings of supabase/auth-config.json (sign-ups off, email link, Google when its secrets exist)"
        type: boolean
        default: false
      generate_types:
        description: "Regenerate supabase/functions/_shared/database.types.ts from staging and commit it to the branch"
        type: boolean
        default: false

concurrency: staging

jobs:
  database:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0  # pinned: "latest" needs a GitHub API lookup that gets rate limited
      - name: Link the staging project
        run: |
          test -n "$PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is not set"; exit 1; }
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: ${{ inputs.push_migrations }}
        run: supabase db push --remote --include-all --yes
      - name: Deploy Edge Functions
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --no-verify-jwt --yes
      - name: Apply Auth settings
        if: ${{ inputs.apply_auth_config }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: supabase/scripts/apply_auth_config.sh
      - name: Generate database types
        if: ${{ inputs.generate_types }}
        run: |
          {
            echo "// Generated by the staging workflow (generate_types) from the staging database. Do not edit by hand."
            supabase gen types typescript --project-id "$PROJECT_REF" --schema public
          } > supabase/functions/_shared/database.types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/database.types.ts
          git diff --cached --quiet || { git commit -m "Database types: regenerated from staging"; git push; }
      - name: Run database tests
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ ! -f supabase/.temp/pooler-url ]; then echo "pooler-url missing after link:"; ls -a supabase/.temp; exit 1; fi
          export PGURL="$(cat supabase/.temp/pooler-url)"
          supabase/scripts/run_tests.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Data layer integration test (Deno, real database)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          url="$(cat supabase/.temp/pooler-url)"
          case "$url" in *sslmode=*) ;; *\?*) url="$url&sslmode=require" ;; *) url="$url?sslmode=require" ;; esac
          export TEST_DB_URL="$url"
          deno test --node-modules-dir=none --allow-net --allow-env supabase/functions/_shared/*_integration_test.ts supabase/functions/catalogo/*_integration_test.ts supabase/import/*_integration_test.ts
