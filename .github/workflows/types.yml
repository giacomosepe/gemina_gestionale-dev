name: Database types

# Generates the TypeScript types of the staging database (public schema) into supabase/functions/_shared/database.types.ts and commits the file
# to the branch it runs on. Run by hand after a migration changes the schema: Actions > Database types > Run workflow (pick the branch).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  types:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate
        run: |
          {
            echo "// Generated by .github/workflows/types.yml from the staging database. Do not edit by hand."
            supabase gen types typescript --project-id "$PROJECT_REF" --schema public
          } > supabase/functions/_shared/database.types.ts
      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/database.types.ts
          git diff --cached --quiet || { git commit -m "Database types: regenerated from staging"; git push; }
