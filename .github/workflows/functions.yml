name: Edge Function checks

# Runs on every pull request that touches the functions: type check and the unit tests of the shared base (no network, no database).
on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions.yml"

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check the shared base and the sample function
        run: deno check --node-modules-dir=none supabase/functions/_shared supabase/functions/message-emails/*.ts supabase/functions/ping/index.ts supabase/functions/catalogo/*.ts supabase/import/*.ts
      - name: Unit tests
        run: deno test --node-modules-dir=none --allow-env=TEST_DB_URL supabase/functions/_shared supabase/functions/message-emails supabase/functions/catalogo supabase/import
